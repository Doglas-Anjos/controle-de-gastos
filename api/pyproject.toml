[project]
name = "gastos"
version = "0.1.0"
description = "Controle financeiro pessoal: Open Finance (Pluggy) + OFX/CSV, recorrencias, previsao e dicas por LLM."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "ofxparse>=0.21",
  "openai>=1.60",
  "python-multipart>=0.0.9",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-httpx>=0.30", "ruff>=0.5"]

[project.scripts]
gastos = "gastos.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
# B008: `Depends(...)` como default e o idioma do FastAPI/Typer
ignore = ["B008"]
